# tame-swarm CI — local GitLab runners + registry
#
# Docker builds use BuildKit (docker buildx) via DinD on the privileged runner.
# Registry: gitlab.hephaestus:5050 (HTTP, insecure).
# Tags: hephaestus (lint, CPU tests), privileged (docker builds), workstation (GPU tests, training).

variables:
  LOCAL_REGISTRY: "gitlab.hephaestus:5050/mipkovich/tame-swarm"

# Without this, every push to a branch with an open MR spawns both a `push`
# pipeline and a `merge_request_event` pipeline for the same commit, and
# both race to rebuild the same CI image on the single privileged runner.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - rebuild-ci
  - check
  - build
  - train

# --- Docker build template (BuildKit + DinD) ---
.docker-build:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=gitlab.hephaestus:5050"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      cat > /tmp/buildkitd.toml << EOF
      [registry."gitlab.hephaestus:5050"]
        http = true
      EOF
    - docker buildx create --use --name ci-builder
        --driver docker-container
        --driver-opt network=host
        --config /tmp/buildkitd.toml
    - docker buildx inspect --bootstrap
  after_script:
    - docker buildx rm ci-builder 2>/dev/null || true
  tags: [privileged]

# --- CI image rebuild ---
# One image for lint, the CPU tests and the GPU tests; see ci/Dockerfile for why.
# The wheel cache is a BuildKit mount on the per-job builder, so a rebuild
# downloads the lock's wheels once per job; the registry cache covers the layers.
rebuild-ci:
  stage: rebuild-ci
  extends: .docker-build
  timeout: 1h
  script:
    - CI_HASH=$(cat ci/Dockerfile pyproject.toml uv.lock | sha256sum | cut -c1-16)
    - docker buildx build
        --file ci/Dockerfile
        --cache-from type=registry,ref=${LOCAL_REGISTRY}/ci-cache
        --cache-to type=registry,ref=${LOCAL_REGISTRY}/ci-cache,mode=max
        --tag ${LOCAL_REGISTRY}/ci:${CI_HASH}
        --tag ${LOCAL_REGISTRY}/ci:latest
        --push .
  rules:
    - changes: [ci/Dockerfile, pyproject.toml, uv.lock]
    - when: manual
      allow_failure: true

# --- Python job template (pre-built CI image) ---
.python-job:
  image:
    name: "${LOCAL_REGISTRY}/ci:latest"
    # `latest` moves whenever rebuild-ci runs. The runners' default is
    # if-not-present, which would keep serving whatever they pulled first.
    pull_policy: [always, if-not-present]
  variables:
    UV_LINK_MODE: copy
    UV_PROJECT_ENVIRONMENT: /app/.venv
  before_script:
    # The image's venv is the lock, so this is an audit plus the project itself.
    # --locked fails loudly when pyproject.toml has moved without `uv lock`.
    - uv sync --locked --extra dev

# --- Check stage ---
lint:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run pytest tests/ -x --tb=short -m "not gpu"

# On the workstation, not the hephaestus box: the locked torch is the CUDA 12.8
# build, whose wheels ship kernels for sm_70 and up, and hephaestus carries a
# GTX 1070 (sm_61) -- every CUDA call there fails with "no kernel image is
# available". The workstation's GPU is what the lock was resolved against.
# Shares the train jobs' resource group so two GPU jobs never overlap there.
test-gpu:
  stage: check
  tags: [workstation, cuda]
  resource_group: gpu
  extends: .python-job
  script:
    - nvidia-smi
    - uv run pytest tests/ -x --tb=short -m gpu

# --- Build stage ---
docker-build:
  stage: build
  extends: .docker-build
  timeout: 3h
  # Starts once the CPU checks pass rather than after the whole stage: the GPU
  # job runs on another runner and has nothing to say about the app image.
  needs: [lint, test]
  script:
    - docker buildx build
        --file tame/Dockerfile
        --cache-from type=registry,ref=${LOCAL_REGISTRY}/build-cache
        --cache-to type=registry,ref=${LOCAL_REGISTRY}/build-cache,mode=max
        --tag ${LOCAL_REGISTRY}:${CI_COMMIT_SHORT_SHA}
        --tag ${LOCAL_REGISTRY}:latest
        --push
        tame/
  rules:
    - changes: [tame/Dockerfile, tame/pyproject.toml, tame/**/*.py]

# --- Training (workstation) ---
train-smoke:
  stage: train
  tags: [workstation, gpu-train]
  resource_group: gpu
  image: "${LOCAL_REGISTRY}:latest"
  timeout: 30m
  script:
    - nvidia-smi
    - python -c "import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))"
    - python tame/train.py --epochs 1 --smoke-test || echo "Smoke test not yet implemented"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

perf-regression:
  stage: train
  tags: [workstation, gpu-train]
  resource_group: gpu
  image: "${LOCAL_REGISTRY}:latest"
  timeout: 1h
  allow_failure: true
  script:
    - echo "Performance regression test placeholder"
    - echo "Compare inference latency against baseline"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
