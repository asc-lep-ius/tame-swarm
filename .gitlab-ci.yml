variables:
  CI_CPU_IMAGE: $CI_REGISTRY_IMAGE/ci-cpu:v1.0.0
  CI_GPU_IMAGE: $CI_REGISTRY_IMAGE/ci-gpu:v1.0.0

stages:
  - rebuild-ci
  - check
  - build

# ── CI image rebuild (only when deps change) ───────────────────────────────

.rebuild-ci:
  stage: rebuild-ci
  image: docker:27
  tags: [ubuntu-desktop-1]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock

rebuild-ci-cpu:
  extends: .rebuild-ci
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_CPU_IMAGE" -f ci/Dockerfile.cpu .
    - docker push "$CI_CPU_IMAGE"
  rules:
    - changes:
        - pyproject.toml
        - uv.lock
        - ci/Dockerfile.cpu

rebuild-ci-gpu:
  extends: .rebuild-ci
  allow_failure: true
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_GPU_IMAGE" -f ci/Dockerfile.gpu .
    - docker push "$CI_GPU_IMAGE"
  rules:
    - changes:
        - pyproject.toml
        - uv.lock
        - ci/Dockerfile.gpu

# ── Base jobs ───────────────────────────────────────────────────────────────

.cpu-job:
  image: $CI_CPU_IMAGE
  tags: [ubuntu-desktop-1]
  before_script:
    - ln -s /app/.venv .venv

.gpu-job:
  image: $CI_GPU_IMAGE
  tags: [ubuntu-desktop-1]
  before_script:
    - ln -s /app/.venv .venv

# ── Check stage ─────────────────────────────────────────────────────────────

lint:
  extends: .cpu-job
  stage: check
  needs:
    - job: rebuild-ci-cpu
      optional: true
  script:
    - uv run --no-sync ruff check .
    - uv run --no-sync ruff format --check .

pyright:
  extends: .cpu-job
  stage: check
  needs:
    - job: rebuild-ci-cpu
      optional: true
  script:
    - uv run --no-sync pyright

test:
  extends: .cpu-job
  stage: check
  needs:
    - job: rebuild-ci-cpu
      optional: true
  before_script:
    - ln -s /app/.venv .venv
    - uv pip install --python .venv/bin/python -e . --no-deps
  script:
    - uv run --no-sync pytest --tb=short -q

test-gpu:
  extends: .gpu-job
  stage: check
  needs:
    - job: rebuild-ci-gpu
      optional: true
  before_script:
    - ln -s /app/.venv .venv
    - uv pip install --python .venv/bin/python -e . --no-deps
  script:
    - uv run --no-sync pytest --tb=short -q -m gpu
  allow_failure: true

# ── Build stage ─────────────────────────────────────────────────────────────

docker-build:
  stage: build
  tags: [ubuntu-desktop-1]
  image: docker:27
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - changes:
        - tame/Dockerfile
        - pyproject.toml
        - uv.lock
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:latest" -f tame/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE:latest"
