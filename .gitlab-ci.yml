variables:
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: .uv-cache

stages:
  - check
  - build

# ── Base job ────────────────────────────────────────────────────────────────

.python-job:
  image: python:${PYTHON_VERSION}-slim
  tags: [ubuntu-desktop-1]
  before_script:
    - pip install uv
    - uv sync --extra dev
  cache:
    key:
      prefix: uv-${PYTHON_VERSION}
      files:
        - uv.lock
    paths:
      - .uv-cache/

# ── Check stage ─────────────────────────────────────────────────────────────

lint:
  extends: .python-job
  stage: check
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  extends: .python-job
  stage: check
  script:
    - uv run pytest --tb=short -q

test-gpu:
  extends: .python-job
  stage: check
  image: nvidia/cuda:12.6.3-cudnn-runtime-ubuntu22.04
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip python3-venv
    - pip install uv
    - uv sync --extra dev
  script:
    - uv run pytest --tb=short -q -m gpu
  allow_failure: true

# ── Build stage ─────────────────────────────────────────────────────────────

docker-build:
  stage: build
  tags: [ubuntu-desktop-1]
  image: docker:27
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  only:
    refs:
      - main
    changes:
      - tame/Dockerfile
      - pyproject.toml
      - uv.lock
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:latest" -f tame/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE:latest"
